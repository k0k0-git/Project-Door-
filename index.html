<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030713">

<title>...</title>

<link rel="preload" as="image" href="principal-meme.jpeg">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  color: #f4f6ff;
  background:
    linear-gradient(
      145deg,
      #030713 0%,
      #07152f 48%,
      #0b2450 100%
    );
  -webkit-tap-highlight-color: transparent;
}


/* =========================
   OPENING SCREEN
   ========================= */

.scene {
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  align-items: center;

  justify-content: flex-start;

  padding:
    max(8vh, 52px)
    16px
    max(76px, env(safe-area-inset-bottom));

  text-align: center;

  transition: opacity 0.8s ease;
}


.intro {
  width: min(94vw, 760px);

  flex: 0 0 auto;

  margin-bottom: clamp(7vh, 10vh, 11vh);
}


#typewriter {
  font-size: clamp(1.2rem, 5.2vw, 1.75rem);

  line-height: 1.9;

  letter-spacing: 0.07em;

  min-height: 7.5rem;
}


.line {
  display: block;
}


.type-char {
  white-space: pre;
}


.cursor {
  display: inline-block;

  width: 2px;
  height: 1em;

  margin-left: 4px;

  vertical-align: -0.12em;

  background: currentColor;

  animation:
    blink
    0.8s
    steps(1, end)
    infinite;
}


@keyframes blink {

  50% {
    opacity: 0;
  }

}


/* =========================
   DOORS
   ========================= */

.doors {
  width: min(98vw, 980px);

  flex: 0 0 auto;

  display: flex;

  justify-content: center;
  align-items: center;

  gap: clamp(18px, 6vw, 58px);
}


.door-button {
  appearance: none;

  border: 0;

  background: transparent;

  color: inherit;

  width: clamp(105px, 27vw, 205px);

  aspect-ratio: 0.58;

  cursor: pointer;

  touch-action: manipulation;

  position: relative;
}


.door-frame {
  position: absolute;

  inset: 0;

  border:
    2px solid
    rgba(151,106,72,0.62);

  border-radius:
    5px 5px 2px 2px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,0.035),
      transparent 20%,
      transparent 80%,
      rgba(255,255,255,0.025)
    ),
    linear-gradient(
      145deg,
      #382015 0%,
      #4d2a18 48%,
      #1f1009 100%
    );

  box-shadow:
    0 18px 45px
    rgba(0,0,0,0.48),

    inset
    0 0 24px
    rgba(0,0,0,0.38);

  overflow: hidden;
}


.door-panel {
  position: absolute;

  inset: 12% 13%;

  border:
    1px solid
    rgba(235,207,180,0.20);

  background:
    linear-gradient(
      145deg,
      #432515 0%,
      #2d180f 55%,
      #1d0e08 100%
    );

  box-shadow:
    inset
    0 0 18px
    rgba(0,0,0,0.30);
}


.door-knob {
  position: absolute;

  right: 16%;
  top: 52%;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #b58a5a;
}


.door-number {
  position: absolute;

  bottom: 8%;

  left: 0;
  right: 0;

  font:
    clamp(.72rem, 2.7vw, .95rem)
    Arial,
    sans-serif;

  letter-spacing: .25em;

  color:
    rgba(255,239,219,.72);
}


/* =========================
   WRONG DOOR SCREEN
   ========================= */

.result {
  position: fixed;

  inset: 0;

  z-index: 10;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    30px
    30px
    max(76px, env(safe-area-inset-bottom));

  text-align: center;

  background: #050b18;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .55s ease,
    visibility .55s ease;
}


.result.show {
  opacity: 1;

  visibility: visible;

  pointer-events: auto;
}


/*
  Restored previous font.
  Typewriter is also unchanged.
*/

.result h2,
.result p,
.retry {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}


.result-card {
  width: min(92vw, 580px);
}


.result h2 {
  font-size:
    clamp(
      1.65rem,
      7vw,
      2.55rem
    );

  font-weight: 500;

  margin-bottom: 18px;
}


.result p {
  font-size:
    clamp(
      1.12rem,
      5.2vw,
      1.5rem
    );

  line-height: 1.65;

  color:
    rgba(245,248,255,.88);

  margin-bottom: 24px;
}


.meme-image {
  display: none;

  width:
    min(72vw,330px);

  max-height: 38svh;

  object-fit: contain;

  margin:
    0 auto
    20px;

  border-radius: 10px;

  box-shadow:
    0 16px 45px
    rgba(0,0,0,.35);

  image-rendering: auto;
}


.result.meme-mode
.meme-image {
  display: block;
}


.retry {
  border:
    1px solid
    rgba(255,255,255,.3);

  background: transparent;

  color: #fff;

  padding:
    12px 22px;

  border-radius: 999px;

  cursor: pointer;

  letter-spacing: .08em;
}


/* =========================
   BIRTHDAY REVEAL
   ========================= */

.birthday {
  position: fixed;

  inset: 0;

  z-index: 20;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    30px
    30px
    max(76px, env(safe-area-inset-bottom));

  text-align: center;

  background:
    linear-gradient(
      145deg,
      #dcecff 0%,
      #f8fbff 52%,
      #ffffff 100%
    );

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:
    opacity 3.25s ease,
    visibility 3.25s ease;
}


.birthday.show {
  opacity: 1;

  visibility: visible;
}


.birthday h1 {
  /*
    Restored previous font.
  */

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: #6b4a32;

  font-size:
    clamp(
      3.25rem,
      15vw,
      8rem
    );

  line-height: .98;

  font-weight: 700;

  letter-spacing: -.045em;

  transform: scale(.04);

  opacity: 0;
}


.birthday .sam {
  display: block;

  margin-top: .12em;

  font-size: 1.18em;
}


.birthday.show h1 {
  animation:
    birthdayZoom
    2.25s
    cubic-bezier(
      .16,
      .84,
      .24,
      1
    )
    forwards;

  animation-delay: 2.25s;
}


@keyframes birthdayZoom {

  0% {
    transform: scale(.04);

    opacity: 0;
  }

  60% {
    transform: scale(1.34);

    opacity: 1;
  }

  100% {
    transform: scale(1);

    opacity: 1;
  }

}


/* =========================
   CREDIT
   ========================= */

.credit {
  position: fixed;

  left: 50%;

  bottom:
    max(
      16px,
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  z-index: 100;

  font:
    500
    clamp(.7rem,2.7vw,.9rem)
    / 1
    Arial,
    sans-serif;

  letter-spacing: .08em;

  white-space: nowrap;

  color:
    rgba(245,248,255,.48);

  pointer-events: none;
}


body.birthday-active
.credit {
  color:
    rgba(107,74,50,.55);
}


/* =========================
   SMALL IPHONES / SHORT
   VIEWPORTS
   ========================= */

@media(max-width:420px) {

  .scene {
    padding-top:
      max(6vh, 42px);

    padding-left: 10px;
    padding-right: 10px;
  }


  .intro {
    margin-bottom:
      clamp(5vh, 7vh, 8vh);
  }


  .doors {
    gap: 12px;
  }


  .door-button {
    width: 30vw;
  }


  .meme-image {
    width:
      min(76vw,330px);
  }

}


@media(max-height:700px) {

  .scene {
    padding-top: 28px;
  }


  .intro {
    margin-bottom: 28px;
  }


  #typewriter {
    min-height: 6.5rem;
  }

}


</style>
</head>


<body>


<!-- =========================
     OPENING
     ========================= -->

<main
  class="scene"
  id="mainScene"
>

  <section class="intro">

    <div
      id="typewriter"
      aria-live="polite"
    ></div>

  </section>


  <section
    class="doors"
    aria-label="Choose a door"
  >

    <button
      class="door-button"
      data-door="1"
      aria-label="Door 1"
    >

      <span class="door-frame">

        <span
          class="door-panel"
        ></span>

        <span
          class="door-knob"
        ></span>

        <span
          class="door-number"
        >
          01
        </span>

      </span>

    </button>


    <button
      class="door-button"
      data-door="2"
      aria-label="Door 2"
    >

      <span class="door-frame">

        <span
          class="door-panel"
        ></span>

        <span
          class="door-knob"
        ></span>

        <span
          class="door-number"
        >
          02
        </span>

      </span>

    </button>


    <button
      class="door-button"
      data-door="3"
      aria-label="Door 3"
    >

      <span class="door-frame">

        <span
          class="door-panel"
        ></span>

        <span
          class="door-knob"
        ></span>

        <span
          class="door-number"
        >
          03
        </span>

      </span>

    </button>

  </section>

</main>


<!-- =========================
     WRONG DOOR
     ========================= -->

<div
  class="result"
  id="wrongResult"
>

  <div class="result-card">

    <img
      class="meme-image"
      src="principal-meme.jpeg"
      alt=""
      decoding="async"
    >

    <h2
      id="wrongTitle"
    ></h2>

    <p
      id="wrongText"
    ></p>

    <button
      class="retry"
      id="retry"
    >
      Try again
    </button>

  </div>

</div>


<!-- =========================
     BIRTHDAY
     ========================= -->

<div
  class="birthday"
  id="birthday"
>

  <h1>

    HAPPY BIRTHDAY,

    <span class="sam">
      SAM!!!
    </span>

  </h1>

</div>


<!-- =========================
     CREDIT
     ========================= -->

<div class="credit">
  Made by Kasra
</div>


<script>

/* =========================
   ELEMENTS
   ========================= */

const typewriter =
  document.getElementById(
    "typewriter"
  );

const wrongResult =
  document.getElementById(
    "wrongResult"
  );

const wrongTitle =
  document.getElementById(
    "wrongTitle"
  );

const wrongText =
  document.getElementById(
    "wrongText"
  );

const birthday =
  document.getElementById(
    "birthday"
  );

const mainScene =
  document.getElementById(
    "mainScene"
  );


/* =========================
   AUDIO
   ========================= */

const doorSound =
  new Audio("door-sound.wav");

const celebrationSound =
  new Audio("celebration-sound.wav");


doorSound.preload = "auto";

celebrationSound.preload =
  "auto";


/*
  Try to load the sounds
  before the user clicks.
*/

doorSound.load();
celebrationSound.load();


function playDoorSound() {

  doorSound.currentTime = 0;

  return doorSound
    .play()
    .catch(() => null);

}


function playCelebrationSound() {

  celebrationSound.currentTime = 0;

  return celebrationSound
    .play()
    .catch(() => null);

}


/* =========================
   TYPEWRITER
   ========================= */

async function typeLine(
  text,
  speed = 102
) {

  const line =
    document.createElement(
      "span"
    );

  line.className = "line";

  typewriter.appendChild(line);


  for(
    const char of text
  ) {

    const letter =
      document.createElement(
        "span"
      );

    letter.className =
      "type-char";

    letter.textContent =
      char;


    const cursor =
      document.createElement(
        "span"
      );

    cursor.className =
      "cursor";


    line.append(
      letter,
      cursor
    );


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          speed
        )
    );


    cursor.remove();

  }


  const finalCursor =
    document.createElement(
      "span"
    );

  finalCursor.className =
    "cursor";

  line.appendChild(
    finalCursor
  );

}


/* =========================
   INTRO
   ========================= */

async function startIntro() {

  await typeLine(
    "Hello."
  );


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        550
      )
  );


  const oldCursor =
    typewriter.querySelector(
      ".cursor"
    );


  if(oldCursor) {
    oldCursor.remove();
  }


  await typeLine(
    "Choose a door to continue."
  );

}


startIntro();


/* =========================
   DOORS
   ========================= */

document
  .querySelectorAll(
    ".door-button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const door =
          Number(
            button.dataset.door
          );


        /*
         * Every door starts
         * with the door-click sound.
         */

        if(door !== 3) {

          playDoorSound();

        }


        /* =====================
           DOOR 3
           ===================== */

        if(door === 3) {

          /*
           * First play the door sound.
           *
           * Once that sound finishes,
           * start the celebration sound.
           *
           * This avoids the two sounds
           * overlapping.
           */

          const doorPlayback =
            playDoorSound();


          if(doorPlayback) {

            await doorPlayback;

          }


          /*
           * Start celebration only
           * after the door sound.
           */

          playCelebrationSound();


          /*
           * Give the celebration
           * audio a moment to begin
           * before changing the scene.
           */

          setTimeout(
            () => {

              mainScene.style.opacity =
                "0";

              mainScene.style.pointerEvents =
                "none";

              birthday.classList.add(
                "show"
              );

              document.body.classList.add(
                "birthday-active"
              );

            },
            180
          );


          return;

        }


        /* =====================
           WRONG DOORS
           ===================== */

        wrongResult.classList.remove(
          "meme-mode"
        );


        /* DOOR 2 */

        if(door === 2) {

          wrongTitle.textContent =
            "";

          wrongText.textContent =
            "دَرِ اِشتِباه آقا، بَرو رِفِرِش کُن";

          wrongResult.classList.add(
            "meme-mode"
          );

        }


        /* DOOR 1 */

        else {

          wrongTitle.textContent =
            "Wrong door.";

          wrongText.textContent =
            "You picked the wrong one. Try again.";

        }


        wrongResult.classList.add(
          "show"
        );

      }
    );

  });


/* =========================
   TRY AGAIN
   ========================= */

document
  .getElementById("retry")
  .addEventListener(
    "click",
    () => {

      wrongResult.classList.remove(
        "show"
      );

    }
  );

</script>

</body>
</html>
