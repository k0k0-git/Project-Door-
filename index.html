<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>...</title>
<link rel="preload" as="image" href="principal-meme.jpeg">
<link rel="preload" as="audio" href="door-sound.wav" type="audio/wav">
<link rel="preload" as="audio" href="celebration-sound.wav" type="audio/wav">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:#f4f6ff;background:linear-gradient(145deg,#030713 0%,#07152f 48%,#0b2450 100%);-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;width:100%;height:100dvh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8dvh 16px calc(14px + env(safe-area-inset-bottom));text-align:center;transition:opacity .8s ease}
.intro{width:min(94vw,760px);margin-top:2dvh;margin-bottom:clamp(32px,8dvh,72px);flex:0 0 auto}
#typewriter{font-size:clamp(1.2rem,5.2vw,1.75rem);line-height:1.9;letter-spacing:.07em;min-height:7.5rem}
.line{display:block}.type-char{white-space:pre}.cursor{display:inline-block;width:2px;height:1em;margin-left:4px;vertical-align:-.12em;background:currentColor;animation:blink .8s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.doors{width:min(98vw,980px);flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center;gap:clamp(18px,6vw,58px);padding-top:clamp(0px,1dvh,10px)}
.door-button{appearance:none;border:0;background:transparent;color:inherit;width:clamp(105px,27vw,205px);aspect-ratio:.58;cursor:pointer;touch-action:manipulation;position:relative;flex:0 0 auto}
.door-frame{position:absolute;inset:0;border:2px solid rgba(151,106,72,.62);border-radius:5px 5px 2px 2px;background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 20%,transparent 80%,rgba(255,255,255,.025)),linear-gradient(145deg,#382015 0%,#4d2a18 48%,#1f1009 100%);box-shadow:0 18px 45px rgba(0,0,0,.48),inset 0 0 24px rgba(0,0,0,.38);overflow:hidden}
.door-panel{position:absolute;inset:12% 13%;border:1px solid rgba(235,207,180,.20);background:linear-gradient(145deg,#432515 0%,#2d180f 55%,#1d0e08 100%);box-shadow:inset 0 0 18px rgba(0,0,0,.30)}
.door-knob{position:absolute;right:16%;top:52%;width:7px;height:7px;border-radius:50%;background:#b58a5a}
.door-number{position:absolute;bottom:8%;left:0;right:0;font:clamp(.72rem,2.7vw,.95rem) Arial,sans-serif;letter-spacing:.25em;color:rgba(255,239,219,.72)}
.result{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:30px 30px calc(76px + env(safe-area-inset-bottom));text-align:center;background:#050b18;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility .55s ease}
.result.show{opacity:1;visibility:visible;pointer-events:auto}
.result-card{width:min(92vw,580px)}
.result h2,.result p,.retry{font-family:Georgia,"Times New Roman",serif}
.result h2{font-size:clamp(1.65rem,7vw,2.55rem);font-weight:500;margin-bottom:18px}
.result p{font-size:clamp(1.12rem,5.2vw,1.5rem);line-height:1.65;color:rgba(245,248,255,.88);margin-bottom:24px}
.meme-image{display:none;width:min(72vw,330px);max-height:38svh;object-fit:contain;margin:0 auto 20px;border-radius:10px;box-shadow:0 16px 45px rgba(0,0,0,.35);image-rendering:auto}
.result.meme-mode .meme-image{display:block}
.retry{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:12px 22px;border-radius:999px;cursor:pointer;letter-spacing:.08em}
.birthday{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:30px 30px calc(76px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(145deg,#dcecff 0%,#f8fbff 52%,#fff 100%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 3.25s ease,visibility 3.25s ease}
.birthday.show{opacity:1;visibility:visible}
.birthday h1{font-family:Georgia,"Times New Roman",serif;color:#6b4a32;font-size:clamp(3.25rem,15vw,8rem);line-height:.98;font-weight:700;letter-spacing:-.045em;transform:scale(.04);opacity:0}
.birthday .sam{display:block;margin-top:.12em;font-size:1.18em}
.birthday.show h1{animation:birthdayZoom 2.25s cubic-bezier(.16,.84,.24,1) forwards;animation-delay:2.25s}
@keyframes birthdayZoom{0%{transform:scale(.04);opacity:0}60%{transform:scale(1.34);opacity:1}100%{transform:scale(1);opacity:1}}
.credit{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;font:500 clamp(.7rem,2.7vw,.9rem)/1 Arial,sans-serif;letter-spacing:.08em;white-space:nowrap;color:rgba(245,248,255,.48);pointer-events:none}
body.birthday-active .credit{color:rgba(107,74,50,.55)}
@media(max-width:420px){
  .scene{padding-left:12px;padding-right:12px;padding-top:8dvh}
  .intro{margin-bottom:clamp(28px,7dvh,56px)}
  .doors{gap:12px}
  .door-button{width:30vw}
  .meme-image{width:min(76vw,330px)}
}
@media(max-height:700px){
  .scene{padding-top:4dvh}
  .intro{margin-top:0;margin-bottom:3dvh}
  #typewriter{min-height:6.5rem}
  .doors{padding-top:0}
}
</style>
</head>
<body>
<main class="scene" id="mainScene">
<section class="intro"><div id="typewriter" aria-live="polite"></div></section>
<section class="doors" aria-label="Choose a door">
<button class="door-button" data-door="1" aria-label="Door 1"><span class="door-frame"><span class="door-panel"></span><span class="door-knob"></span><span class="door-number">01</span></span></button>
<button class="door-button" data-door="2" aria-label="Door 2"><span class="door-frame"><span class="door-panel"></span><span class="door-knob"></span><span class="door-number">02</span></span></button>
<button class="door-button" data-door="3" aria-label="Door 3"><span class="door-frame"><span class="door-panel"></span><span class="door-knob"></span><span class="door-number">03</span></span></button>
</section>
</main>
<div class="result" id="wrongResult"><div class="result-card"><img class="meme-image" src="principal-meme.jpeg" alt=""><h2 id="wrongTitle"></h2><p id="wrongText"></p><button class="retry" id="retry">Try again</button></div></div>
<div class="birthday" id="birthday"><h1>HAPPY BIRTHDAY,<span class="sam">SAM!!!</span></h1></div>
<div class="credit">Made by Kasra</div>

<script>
const typewriter=document.getElementById("typewriter");
const wrongResult=document.getElementById("wrongResult");
const wrongTitle=document.getElementById("wrongTitle");
const wrongText=document.getElementById("wrongText");
const birthday=document.getElementById("birthday");
const mainScene=document.getElementById("mainScene");

const doorSound=new Audio("door-sound.wav");
const celebrationSound=new Audio("celebration-sound.wav");
doorSound.preload="auto";
celebrationSound.preload="auto";
doorSound.load();
celebrationSound.load();

/*
  The door sound is prepared in advance in two ways:
  1. HTMLAudio is preloaded immediately.
  2. Web Audio fetches/decodes the WAV while the intro is on screen.
  On touch, the already-decoded buffer can start immediately from the
  user gesture instead of waiting for Safari to fetch/decode the file.
*/
let audioContext=null;
let doorBuffer=null;
let doorBufferPromise=null;
let doorTapPromise=null;
let doorTapStarted=false;
let doorSource=null;
let doorSourceEndedPromise=null;
let interactionLocked=false;

try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(AudioContextClass){
    audioContext=new AudioContextClass();
    doorBufferPromise=fetch("door-sound.wav")
      .then(r=>r.arrayBuffer())
      .then(data=>audioContext.decodeAudioData(data))
      .then(buffer=>{doorBuffer=buffer;return buffer})
      .catch(()=>null);
    fetch("celebration-sound.wav")
      .then(r=>r.arrayBuffer())
      .then(data=>audioContext.decodeAudioData(data))
      .catch(()=>null);
  }
}catch(e){}

function startDoorSound(){
  if(doorTapPromise)return doorTapPromise;

  doorTapPromise=(async()=>{
    if(audioContext&&doorBuffer){
      try{
        await audioContext.resume();
        doorSource=audioContext.createBufferSource();
        doorSource.buffer=doorBuffer;
        doorSource.connect(audioContext.destination);

        doorSourceEndedPromise=new Promise(resolve=>{
          doorSource.addEventListener("ended",resolve,{once:true});
        });

        doorSource.start(0);
        return true;
      }catch(e){}
    }

    try{
      doorSound.pause();
      doorSound.currentTime=0;
      await doorSound.play();
      doorSourceEndedPromise=new Promise(resolve=>{
        if(doorSound.ended)resolve();
        else doorSound.addEventListener("ended",resolve,{once:true});
      });
      return true;
    }catch(e){
      return false;
    }
  })();

  return doorTapPromise;
}

function resetDoorTap(){
  doorTapPromise=null;
  doorTapStarted=false;
  doorSource=null;
  doorSourceEndedPromise=null;
}

function primeDoorTap(){
  if(doorTapStarted)return;
  doorTapStarted=true;
  startDoorSound();
}

async function typeLine(text,speed=102){
  const line=document.createElement("span");
  line.className="line";
  typewriter.appendChild(line);

  for(const char of text){
    const letter=document.createElement("span");
    letter.className="type-char";
    letter.textContent=char;

    const cursor=document.createElement("span");
    cursor.className="cursor";

    line.append(letter,cursor);
    await new Promise(resolve=>setTimeout(resolve,speed));
    cursor.remove();
  }

  const finalCursor=document.createElement("span");
  finalCursor.className="cursor";
  line.appendChild(finalCursor);
}

async function startIntro(){
  await typeLine("Hello.");
  await new Promise(resolve=>setTimeout(resolve,550));
  const oldCursor=typewriter.querySelector(".cursor");
  if(oldCursor)oldCursor.remove();
  await typeLine("Choose a door to continue.");
}
startIntro();

async function showBirthday(){
  if(interactionLocked)return;
  interactionLocked=true;

  const audioStarted=await startDoorSound();
  if(!audioStarted){
    interactionLocked=false;
    return;
  }

  // The visual transition begins with the tap. We no longer wait for the
  // entire door sound before changing the screen.
  mainScene.style.opacity="0";
  mainScene.style.pointerEvents="none";
  birthday.classList.add("show");
  document.body.classList.add("birthday-active");

  // Celebration starts immediately after the short door sound ends.
  try{
    if(doorSourceEndedPromise)await doorSourceEndedPromise;
    await celebrationSound.play();
  }catch(e){
    try{
      celebrationSound.pause();
      celebrationSound.currentTime=0;
      await celebrationSound.play();
    }catch(_e){}
  }
}

document.querySelectorAll(".door-button").forEach(button=>{
  button.addEventListener("pointerdown",()=>{
    if(!interactionLocked)primeDoorTap();
  });

  button.addEventListener("click",async()=>{
    if(interactionLocked)return;

    const audioStarted=await startDoorSound();
    if(!audioStarted)return;

    const door=Number(button.dataset.door);

    if(door===3){
      await showBirthday();
      return;
    }

    wrongResult.classList.remove("meme-mode");

    if(door===2){
      wrongTitle.textContent="";
      wrongText.textContent="دَرِ اِشتِباه آقا، بَرو رِفِرِش کُن";
      wrongResult.classList.add("meme-mode");
    }else{
      wrongTitle.textContent="Wrong door.";
      wrongText.textContent="You picked the wrong one. Try again.";
    }

    wrongResult.classList.add("show");
  });
});

document.getElementById("retry").addEventListener("click",()=>{
  wrongResult.classList.remove("show");
  resetDoorTap();
});
</script>
</body>
</html>
