<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#050b1c">

<title>...</title>

<style>

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

html,

body {

  width: 100%;

  min-height: 100%;

  overflow: hidden;

}

body {

  font-family: Georgia, "Times New Roman", serif;

  color: #f4f6ff;

  background: linear-gradient(

    145deg,

    #030713 0%,

    #07152f 48%,

    #0b2450 100%

  );

  -webkit-tap-highlight-color: transparent;

}

.scene {

  width: 100%;

  min-height: 100svh;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 10px 20px 70px;

  transform: translateY(-3.5vh);

  text-align: center;

  transition: opacity 0.8s ease;

}

.intro {

  width: min(90vw, 700px);

  margin-bottom: 48px;

}

#typewriter {

  font-size: clamp(1.15rem, 4.8vw, 1.65rem);

  line-height: 1.9;

  letter-spacing: 0.07em;

  min-height: 7.5rem;

}

.line {

  display: block;

}

.type-char {

  white-space: pre;

}

.cursor {

  display: inline-block;

  width: 2px;

  height: 1em;

  margin-left: 4px;

  vertical-align: -0.12em;

  background: currentColor;

  animation: blink 0.8s steps(1, end) infinite;

}

@keyframes blink {

  50% {

    opacity: 0;

  }

}

/* =========================

   DOORS

   ========================= */

.doors {

  width: min(94vw, 900px);

  display: flex;

  justify-content: center;

  gap: clamp(16px, 5vw, 48px);

}

.door-button {

  appearance: none;

  border: 0;

  background: transparent;

  color: inherit;

  width: clamp(90px, 24vw, 185px);

  aspect-ratio: 0.58;

  cursor: pointer;

  touch-action: manipulation;

  position: relative;

}

.door-frame {

  position: absolute;

  inset: 0;

  border: 2px solid rgba(151, 106, 72, 0.62);

  border-radius: 5px 5px 2px 2px;

  background:

    linear-gradient(

      90deg,

      rgba(255,255,255,0.035),

      transparent 20%,

      transparent 80%,

      rgba(255,255,255,0.025)

    ),

    linear-gradient(

      145deg,

      #452718 0%,

      #60371f 48%,

      #28150d 100%

    );

  box-shadow:

    0 18px 45px rgba(0,0,0,0.48),

    inset 0 0 24px rgba(0,0,0,0.38);

  overflow: hidden;

}

.door-panel {

  position: absolute;

  inset: 12% 13%;

  border: 1px solid rgba(235,207,180,0.20);

  background:

    linear-gradient(

      145deg,

      #512e1b 0%,

      #382014 55%,

      #24130c 100%

    );

  box-shadow: inset 0 0 18px rgba(0,0,0,0.30);

}

.door-knob {

  position: absolute;

  right: 16%;

  top: 52%;

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background: #b58a5a;

}

.door-number {

  position: absolute;

  bottom: 8%;

  left: 0;

  right: 0;

  font: clamp(0.7rem, 2.5vw, 0.9rem) Arial, sans-serif;

  letter-spacing: 0.25em;

  color: rgba(255,239,219,0.72);

}

/* =========================

   WRONG DOOR SCREEN

   ========================= */

.result {

  position: fixed;

  inset: 0;

  z-index: 10;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 30px 30px 70px;

  text-align: center;

  background: #050b18;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:

    opacity 0.55s ease,

    visibility 0.55s ease;

}

.result.show {

  opacity: 1;

  visibility: visible;

  pointer-events: auto;

}

.result-card {

  width: min(90vw, 560px);

}

.result h2 {

  font-size: clamp(1.5rem, 6vw, 2.3rem);

  font-weight: 400;

  margin-bottom: 18px;

}

.result p {

  font:

    clamp(1.05rem, 5vw, 1.45rem)

    / 1.65

    Georgia,

    "Times New Roman",

    serif;

  color: rgba(245,248,255,0.86);

  margin-bottom: 24px;

}

/* Principal image */

.meme-image {

  display: none;

  width: min(72vw, 330px);

  max-height: 38svh;

  object-fit: contain;

  margin: 0 auto 20px;

  border-radius: 10px;

  box-shadow: 0 16px 45px rgba(0,0,0,0.35);

}

.result.meme-mode .meme-image {

  display: block;

}

.retry {

  border: 1px solid rgba(255,255,255,0.3);

  background: transparent;

  color: #fff;

  padding: 12px 22px;

  border-radius: 999px;

  cursor: pointer;

  letter-spacing: 0.08em;

}

/* =========================

   BIRTHDAY REVEAL

   ========================= */

.birthday {

  position: fixed;

  inset: 0;

  z-index: 20;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 30px 30px 70px;

  text-align: center;

  background:

    linear-gradient(

      145deg,

      #dcecff 0%,

      #f8fbff 52%,

      #ffffff 100%

    );

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:

    opacity 3.25s ease,

    visibility 3.25s ease;

}

.birthday.show {

  opacity: 1;

  visibility: visible;

}

.birthday h1 {

  color: #6b4a32;

  font-size: clamp(2.6rem, 12vw, 7rem);

  line-height: 1.04;

  font-weight: 700;

  letter-spacing: -0.03em;

  transform: scale(0.04);

  opacity: 0;

}

.birthday .sam {

  display: block;

  margin-top: 0.14em;

  font-size: 1.18em;

}

.birthday.show h1 {

  animation:

    birthdayZoom

    1.35s

    cubic-bezier(0.16,0.84,0.24,1)

    forwards;

  animation-delay: 2.95s;

}

@keyframes birthdayZoom {

  0% {

    transform: scale(0.04);

    opacity: 0;

  }

  58% {

    transform: scale(1.18);

    opacity: 1;

  }

  100% {

    transform: scale(1);

    opacity: 1;

  }

}

/* =========================

   CREDIT

   ========================= */

.credit {

  position: fixed;

  left: 50%;

  bottom: max(16px, env(safe-area-inset-bottom));

  transform: translateX(-50%);

  z-index: 100;

  font:

    500

    clamp(0.7rem, 2.7vw, 0.9rem)

    / 1

    Arial,

    sans-serif;

  letter-spacing: 0.08em;

  white-space: nowrap;

  color: rgba(245,248,255,0.48);

  pointer-events: none;

}

body.birthday-active .credit {

  color: rgba(107,74,50,0.55);

}

/* =========================

   MOBILE

   ========================= */

@media (max-width: 420px) {

  .doors {

    gap: 10px;

  }

  .door-button {

    width: 29vw;

  }

  .meme-image {

    width: min(76vw, 330px);

  }

}

</style>

</head>

<body>

<!-- =========================

     MAIN OPENING

     ========================= -->

<main class="scene" id="mainScene">

  <section class="intro">

    <div id="typewriter" aria-live="polite"></div>

  </section>

  <section class="doors" aria-label="Choose a door">

    <button

      class="door-button"

      data-door="1"

      aria-label="Door 1"

    >

      <span class="door-frame">

        <span class="door-panel"></span>

        <span class="door-knob"></span>

        <span class="door-number">01</span>

      </span>

    </button>

    <button

      class="door-button"

      data-door="2"

      aria-label="Door 2"

    >

      <span class="door-frame">

        <span class="door-panel"></span>

        <span class="door-knob"></span>

        <span class="door-number">02</span>

      </span>

    </button>

    <button

      class="door-button"

      data-door="3"

      aria-label="Door 3"

    >

      <span class="door-frame">

        <span class="door-panel"></span>

        <span class="door-knob"></span>

        <span class="door-number">03</span>

      </span>

    </button>

  </section>

</main>

<!-- =========================

     WRONG DOOR

     ========================= -->

<div class="result" id="wrongResult">

  <div class="result-card">

    <img

      class="meme-image"

      src="principal-meme.jpeg"

      alt=""

    >

    <h2 id="wrongTitle"></h2>

    <p id="wrongText"></p>

    <button

      class="retry"

      id="retry"

    >

      Try again

    </button>

  </div>

</div>

<!-- =========================

     BIRTHDAY SCREEN

     ========================= -->

<div class="birthday" id="birthday">

  <h1>

    HAPPY BIRTHDAY,

    <span class="sam">SAM!!!</span>

  </h1>

</div>

<!-- =========================

     CREDIT

     ========================= -->

<div class="credit">

  Made by Kasra

</div>

<script>

const typewriter =

  document.getElementById("typewriter");

const wrongResult =

  document.getElementById("wrongResult");

const wrongTitle =

  document.getElementById("wrongTitle");

const wrongText =

  document.getElementById("wrongText");

const birthday =

  document.getElementById("birthday");

const mainScene =

  document.getElementById("mainScene");

/* =========================

   TYPEWRITER

   ========================= */

async function typeLine(text, speed = 102) {

  const line =

    document.createElement("span");

  line.className = "line";

  typewriter.appendChild(line);

  for (const char of text) {

    const letter =

      document.createElement("span");

    letter.className = "type-char";

    letter.textContent = char;

    const cursor =

      document.createElement("span");

    cursor.className = "cursor";

    line.append(letter, cursor);

    await new Promise(resolve =>

      setTimeout(resolve, speed)

    );

    cursor.remove();

  }

  const finalCursor =

    document.createElement("span");

  finalCursor.className = "cursor";

  line.appendChild(finalCursor);

}

/* =========================

   START INTRO

   ========================= */

async function startIntro() {

  await typeLine("Hello.");

  await new Promise(resolve =>

    setTimeout(resolve, 550)

  );

  const oldCursor =

    typewriter.querySelector(".cursor");

  if (oldCursor) {

    oldCursor.remove();

  }

  await typeLine(

    "Choose a door to continue."

  );

}

startIntro();

/* =========================

   DOOR INTERACTIONS

   ========================= */

document

  .querySelectorAll(".door-button")

  .forEach(button => {

    button.addEventListener("click", () => {

      const door =

        Number(button.dataset.door);

      /* =====================

         DOOR 3 = BIRTHDAY

         ===================== */

      if (door === 3) {

        mainScene.style.opacity = "0";

        mainScene.style.pointerEvents =

          "none";

        setTimeout(() => {

          birthday.classList.add("show");

          document.body.classList.add(

            "birthday-active"

          );

        }, 300);

        return;

      }

      /* =====================

         WRONG DOORS

         ===================== */

      wrongResult.classList.remove(

        "meme-mode"

      );

      /* DOOR 2 = PRINCIPAL MEME */

      if (door === 2) {

        wrongTitle.textContent = "";

        wrongText.textContent =

          "دَرِ اِشتِباه آقا، بَرو رِفرِش کن";

        wrongResult.classList.add(

          "meme-mode"

        );

      }

      /* DOOR 1 = NORMAL WRONG MESSAGE */

      else {

        wrongTitle.textContent =

          "Wrong door.";

        wrongText.textContent =

          "You picked the wrong one. Try again.";

      }

      wrongResult.classList.add("show");

    });

  });

/* =========================

   TRY AGAIN

   ========================= */

document

  .getElementById("retry")

  .addEventListener("click", () => {

    wrongResult.classList.remove("show");

  });

</script>

</body>

</html>
